<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Excellence Academy</title>
    <meta name="description" content="Login to your Excellence Academy account">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%231E3A8A'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='60' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'academic-blue': '#1E3A8A',
                        'warm-gold': '#F59E0B',
                        'accent-gold': '#FBBF24',
                    },
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#020617] text-[#0F172A] dark:text-[#E5E7EB] transition-colors duration-300 min-h-screen flex items-center justify-center px-4">
    
    <!-- Login Card -->
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-[#1e293b] rounded-2xl p-8 shadow-2xl">
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <a href="index.html" class="flex items-center justify-center space-x-2 mb-4 hover:opacity-80 transition">
                    <div class="w-12 h-12 bg-academic-blue dark:bg-[#3B82F6] rounded-lg flex items-center justify-center">
                        <span class="text-white font-heading font-bold text-2xl">E</span>
                    </div>
                    <span class="font-heading font-bold text-2xl text-[#0F172A] dark:text-[#E5E7EB]">Excellence Academy</span>
                </a>
                <h1 class="text-3xl font-heading font-bold mb-2 text-[#0F172A] dark:text-[#E5E7EB]">
                    Welcome Back
                </h1>
                <p class="text-[#475569] dark:text-[#94a3b8]">
                    Sign in to your account to continue
                </p>
            </div>
            
            <!-- Login Form -->
            <form class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium mb-2 text-[#0F172A] dark:text-[#E5E7EB]">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 rounded-lg bg-[#F8FAFC] dark:bg-[#0f172a] border border-gray-300 dark:border-white/10 text-[#0F172A] dark:text-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-academic-blue dark:focus:ring-[#3B82F6] transition"
                        placeholder="you@example.com">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium mb-2 text-[#0F172A] dark:text-[#E5E7EB]">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 rounded-lg bg-[#F8FAFC] dark:bg-[#0f172a] border border-gray-300 dark:border-white/10 text-[#0F172A] dark:text-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-academic-blue dark:focus:ring-[#3B82F6] transition"
                        placeholder="••••••••">
                </div>
                
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-academic-blue dark:text-[#3B82F6] border-gray-300 rounded focus:ring-academic-blue dark:focus:ring-[#3B82F6]">
                        <span class="ml-2 text-sm text-[#475569] dark:text-[#94a3b8]">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-academic-blue dark:text-[#3B82F6] hover:opacity-80 transition">Forgot password?</a>
                </div>
                
                <button type="submit" class="w-full px-6 py-3 bg-academic-blue dark:bg-[#3B82F6] text-white rounded-lg font-medium hover:opacity-90 transition transform hover:scale-105">
                    Sign In
                </button>
            </form>
            
            <!-- Social Login -->
            <div class="mt-6">
                <div class="relative mb-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300 dark:border-white/10"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-[#1e293b] text-[#475569] dark:text-[#94a3b8]">Or sign in with</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="flex items-center justify-center px-4 py-3 border border-gray-300 dark:border-white/10 rounded-lg bg-white dark:bg-[#0f172a] text-[#0F172A] dark:text-[#E5E7EB] hover:bg-gray-50 dark:hover:bg-white/5 transition">
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="text-sm font-medium">Google</span>
                    </button>
                    <button type="button" class="flex items-center justify-center px-4 py-3 border border-gray-300 dark:border-white/10 rounded-lg bg-white dark:bg-[#0f172a] text-[#0F172A] dark:text-[#E5E7EB] hover:bg-gray-50 dark:hover:bg-white/5 transition">
                        <svg class="w-5 h-5 mr-2" fill="#1877F2" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        <span class="text-sm font-medium">Facebook</span>
                    </button>
                </div>
            </div>
            
            <!-- Register Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-[#475569] dark:text-[#94a3b8]">
                    Don't have an account?
                    <a href="register.html" class="text-academic-blue dark:text-[#3B82F6] font-medium hover:opacity-80 transition">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Theme Toggle Script -->
    <script src="assets/js/theme.js"></script>
</body>
</html>
